services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: toptenug
      POSTGRES_USER: toptenug
      POSTGRES_PASSWORD: toptenug
    ports:
      - "5432:5432"
    volumes:
      - toptenug_pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/001-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toptenug -d toptenug"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  toptenug_pgdata:
