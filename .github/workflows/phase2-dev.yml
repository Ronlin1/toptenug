name: Phase 2 Dev Check

on:
  push:
    branches: [feat/phase2-live-data]
    paths:
      - "services/core/**"
      - "apps/web/**"
      - "scripts/**"
      - "infra/**"
      - ".github/workflows/phase2-dev.yml"

concurrency:
  group: phase2-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    if: ${{ !startsWith(github.event.head_commit.message, 'test(web):') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: toptenug
          POSTGRES_USER: toptenug
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U toptenug -d toptenug" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: "postgresql+psycopg://toptenug@localhost:5432/toptenug"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --project services/core --all-groups
      - name: Migration round-trip
        id: migrations
        continue-on-error: true
        run: |
          cd services/core
          uv run alembic upgrade head
          uv run alembic downgrade 0001_core_domain
          uv run alembic upgrade head
      - name: Ruff
        id: ruff
        continue-on-error: true
        run: cd services/core && uv run ruff check .
      - name: Mypy
        id: mypy
        continue-on-error: true
        run: cd services/core && uv run mypy app
      - name: Phase 2 core tests
        id: core_tests
        continue-on-error: true
        run: cd services/core && uv run pytest -q
      - name: Report conclusions
        run: |
          echo "migrations=${{ steps.migrations.outcome }}"
          echo "ruff=${{ steps.ruff.outcome }}"
          echo "mypy=${{ steps.mypy.outcome }}"
          echo "core_tests=${{ steps.core_tests.outcome }}"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pnpm --dir apps/web install --frozen-lockfile=false
      - name: TypeScript
        id: web_lint
        continue-on-error: true
        run: pnpm --dir apps/web lint
      - name: Vitest
        id: web_tests
        continue-on-error: true
        run: pnpm --dir apps/web test
      - name: Install Playwright Chromium
        id: browser_install
        continue-on-error: true
        run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: Playwright
        id: web_e2e
        continue-on-error: true
        run: pnpm --dir apps/web exec playwright test
      - name: Report web conclusions
        run: |
          echo "web_lint=${{ steps.web_lint.outcome }}"
          echo "web_tests=${{ steps.web_tests.outcome }}"
          echo "browser_install=${{ steps.browser_install.outcome }}"
          echo "web_e2e=${{ steps.web_e2e.outcome }}"
