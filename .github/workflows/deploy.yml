name: Deploy TopTenUG

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target deployment environment
        required: true
        type: choice
        options:
          - staging
          - production
      commit_sha:
        description: Exact tested commit SHA to deploy
        required: true
        type: string

concurrency:
  group: deploy-toptenug-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      TOPTENUG_ENVIRONMENT: ${{ inputs.environment }}
      TOPTENUG_GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      TOPTENUG_GCP_REGION: ${{ vars.GCP_REGION }}
      TOPTENUG_ARTIFACT_REPOSITORY: ${{ vars.ARTIFACT_REPOSITORY }}
      TOPTENUG_SUPABASE_REGION: ${{ vars.SUPABASE_REGION }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
      GITHUB_TOKEN: ${{ secrets.TOPTENUG_GITHUB_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      TOPTENUG_PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
      TOPTENUG_ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
      TOPTENUG_COMMIT_SHA: ${{ inputs.commit_sha }}
      TOPTENUG_PREVIEW_API_BASE_URL: ${{ vars.PREVIEW_API_BASE_URL }}
      TOPTENUG_PRODUCTION_API_BASE_URL: ${{ vars.PRODUCTION_API_BASE_URL }}
      NEXT_PUBLIC_API_BASE_URL: ${{ inputs.environment == 'staging' && vars.PREVIEW_API_BASE_URL || vars.PRODUCTION_API_BASE_URL }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate deployment routing before external changes
        run: python scripts/validate_deployment_config.py --environment "${{ inputs.environment }}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure Artifact Registry
        run: gcloud auth configure-docker "${TOPTENUG_GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push API image
        run: |
          IMAGE_ROOT="${TOPTENUG_GCP_REGION}-docker.pkg.dev/${TOPTENUG_GCP_PROJECT_ID}/${TOPTENUG_ARTIFACT_REPOSITORY}"
          docker build -f infra/cloudrun/core.Dockerfile -t "${IMAGE_ROOT}/core:${TOPTENUG_COMMIT_SHA}" .
          docker push "${IMAGE_ROOT}/core:${TOPTENUG_COMMIT_SHA}"

      - name: Build and push worker image
        run: |
          IMAGE_ROOT="${TOPTENUG_GCP_REGION}-docker.pkg.dev/${TOPTENUG_GCP_PROJECT_ID}/${TOPTENUG_ARTIFACT_REPOSITORY}"
          docker build -f infra/cloudrun/worker.Dockerfile -t "${IMAGE_ROOT}/worker:${TOPTENUG_COMMIT_SHA}" .
          docker push "${IMAGE_ROOT}/worker:${TOPTENUG_COMMIT_SHA}"

      - name: Run database migrations through direct admin connection
        run: |
          cd services/core
          DATABASE_URL="${DATABASE_ADMIN_URL}" uv run alembic upgrade head

      - name: Deploy Cloud Run API revision
        run: |
          IMAGE_ROOT="${TOPTENUG_GCP_REGION}-docker.pkg.dev/${TOPTENUG_GCP_PROJECT_ID}/${TOPTENUG_ARTIFACT_REPOSITORY}"
          gcloud run deploy toptenug-core \
            --image "${IMAGE_ROOT}/core:${TOPTENUG_COMMIT_SHA}" \
            --region "${TOPTENUG_GCP_REGION}" \
            --project "${TOPTENUG_GCP_PROJECT_ID}" \
            --platform managed \
            --quiet

      - name: Deploy worker job definitions
        run: |
          IMAGE_ROOT="${TOPTENUG_GCP_REGION}-docker.pkg.dev/${TOPTENUG_GCP_PROJECT_ID}/${TOPTENUG_ARTIFACT_REPOSITORY}"
          for JOB in toptenug-discover-technology toptenug-ingest-github toptenug-derive-quarter toptenug-validate-quarter toptenug-publish-quarter; do
            gcloud run jobs deploy "${JOB}" \
              --image "${IMAGE_ROOT}/worker:${TOPTENUG_COMMIT_SHA}" \
              --region "${TOPTENUG_GCP_REGION}" \
              --project "${TOPTENUG_GCP_PROJECT_ID}" \
              --quiet
          done

      - name: Install Vercel CLI
        run: pnpm add --global vercel@latest

      - name: Pull Vercel project settings
        working-directory: apps/web
        run: vercel pull --yes --environment="${{ inputs.environment == 'production' && 'production' || 'preview' }}" --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build Vercel deployment
        working-directory: apps/web
        run: vercel build ${{ inputs.environment == 'production' && '--prod' || '' }} --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy Vercel output
        working-directory: apps/web
        run: vercel deploy --prebuilt ${{ inputs.environment == 'production' && '--prod' || '' }} --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Smoke deployed API
        run: |
          TARGET_API="${TOPTENUG_PREVIEW_API_BASE_URL}"
          if [ "${{ inputs.environment }}" = "production" ]; then
            TARGET_API="${TOPTENUG_PRODUCTION_API_BASE_URL}"
          fi
          python scripts/smoke_production.py --api-base-url "${TARGET_API}" --quarter 2026-Q3 --category github-developers
