[project]
name = "toptenug-core"
version = "0.1.0"
description = "Evidence-first ranking and intelligence service for TopTenUG"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi[standard]>=0.116,<1",
  "google-genai>=1.30,<2",
  "httpx>=0.28,<1",
  "pgvector>=0.4,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0,<7",
  "sqlalchemy>=2.0,<3",
  "typer>=0.16,<1",
]
[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
  "types-PyYAML>=6.0.12",
]
[project.scripts]
toptenug = "app.cli:main"
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
target-version = "py313"
line-length = 120
[tool.ruff.lint]
select = ["F"]
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Query", "typer.Option"]
[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
packages = ["app"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["app"]
