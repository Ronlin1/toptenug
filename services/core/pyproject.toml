[project]
name = "toptenug-core"
version = "0.1.0"
description = "TopTenUG evidence and ranking core"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.13",
  "fastapi>=0.115",
  "google-genai>=1.0",
  "httpx>=0.28",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = ["mypy>=1.13", "pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
